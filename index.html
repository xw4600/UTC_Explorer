<title>Eastern vs UTC Clock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one large analog dial centered on black, readouts and a reset control beneath it.
   Single committed look (black, #04650D, red), so no light theme. */
:root {
  --bg: #000000;
  --green: #04650D;
  --red: #E5232B;
  --font-num: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--green);
  font-family: var(--font-mono);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#dial {
  display: block;
  width: min(100%, 720px, calc(100svh - 240px));
  aspect-ratio: 1;
  max-width: 100%;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#dial .stk { stroke: var(--green); fill: none; stroke-linecap: round; }
#dial .fil { fill: var(--green); }
#dial .red-stk { stroke: var(--red); fill: none; stroke-linecap: round; }
#dial .red-fil { fill: var(--red); }
#dial .ring { stroke: var(--red); fill: none; opacity: 0.55; stroke-dasharray: 5 6; }
#dial .hit { stroke: transparent; fill: transparent; pointer-events: stroke; }
#dial .hit-tip { fill: transparent; pointer-events: all; }
#dial text {
  font-family: var(--font-num);
  font-weight: 600;
  fill: var(--green);
  text-anchor: middle;
  dominant-baseline: central;
}
#uh { cursor: grab; outline: none; }
#uh.dragging { cursor: grabbing; }
#uh:focus-visible .ring { opacity: 1; stroke-dasharray: none; }
.readout { display: grid; gap: 6px; justify-items: center; min-width: 0; }
.row {
  display: flex;
  align-items: baseline;
  gap: 14px;
  font-size: clamp(20px, 4.6vw, 30px);
  font-variant-numeric: tabular-nums;
  flex-wrap: wrap;
  justify-content: center;
}
.row .tag { letter-spacing: 0.12em; font-size: 0.7em; min-width: 5.2em; text-align: right; }
.row .date { font-size: 0.6em; letter-spacing: 0.04em; }
.row.utc { color: var(--red); }
.controls { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
.mode { font-size: 14px; letter-spacing: 0.14em; min-width: 9.5em; text-align: center; }
.mode.exploring { color: var(--red); }
button {
  font: inherit;
  font-size: 16px;
  letter-spacing: 0.06em;
  color: var(--green);
  background: transparent;
  border: 2px solid var(--green);
  padding: 10px 20px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: var(--green); color: var(--bg); }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
button:disabled { opacity: 0.35; cursor: default; }
.note { margin: 0; font-size: 14px; letter-spacing: 0.04em; text-align: center; }
</style>

<svg id="dial" viewBox="0 0 800 800" aria-hidden="true"></svg>

<div class="readout">
  <div class="row et"><span class="tag">EASTERN</span><span id="et">--:-- --</span><span id="tz"></span><span class="date" id="etd"></span></div>
  <div class="row utc"><span class="tag">UTC</span><span id="ut">--:--</span><span class="date" id="utd"></span></div>
  <p class="note" id="diff"></p>
</div>

<div class="controls">
  <span class="mode" id="mode" aria-live="polite">LIVE</span>
  <button id="reset" type="button" disabled>Back to current time</button>
</div>
<p class="note">Drag the red hand (or focus it and use the arrow keys). The green hands follow.</p>

<script>
(function () {
  var C = 400, MIN = 60000, HALF_DAY = 12 * 3600 * 1000;
  var svg = document.getElementById('dial');

  function pt(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return [C + r * Math.cos(a), C + r * Math.sin(a)];
  }
  var s = '';
  s += '<circle class="stk" cx="400" cy="400" r="392" stroke-width="6"/>';
  for (var m = 0; m < 60; m++) {
    var major = m % 5 === 0;
    var p1 = pt(300, m * 6), p2 = pt(major ? 270 : 286, m * 6);
    s += '<line class="stk" x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) +
         '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) +
         '" stroke-width="' + (major ? 7 : 2.5) + '"/>';
  }
  for (var n = 1; n <= 12; n++) {
    var o = pt(344, n * 30), i = pt(226, n * 30);
    s += '<text x="' + o[0].toFixed(1) + '" y="' + o[1].toFixed(1) + '" font-size="62">' + n + '</text>';
    s += '<text x="' + i[0].toFixed(1) + '" y="' + i[1].toFixed(1) + '" font-size="30" opacity="0.8">' +
         (n === 12 ? 24 : n + 12) + '</text>';
  }
  s += '<g id="hh"><line class="stk" x1="400" y1="428" x2="400" y2="250" stroke-width="18"/></g>';
  s += '<g id="mh"><line class="stk" x1="400" y1="436" x2="400" y2="112" stroke-width="10"/></g>';
  s += '<circle class="fil" cx="400" cy="400" r="20"/>';
  s += '<g id="uh" tabindex="0" role="slider" aria-label="UTC hour hand" aria-valuemin="0" aria-valuemax="1440">' +
       '<line class="hit" x1="400" y1="440" x2="400" y2="168" stroke-width="64"/>' +
       '<line class="red-stk" x1="400" y1="440" x2="400" y2="168" stroke-width="7"/>' +
       '<circle class="hit-tip" cx="400" cy="160" r="40"/>' +
       '<circle class="ring" cx="400" cy="160" r="30" stroke-width="3"/>' +
       '<circle class="red-fil" cx="400" cy="160" r="15"/></g>';
  s += '<circle class="red-fil" cx="400" cy="400" r="8" style="pointer-events:none"/>';
  svg.innerHTML = s;

  var etFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hourCycle: 'h23',
    hour: 'numeric', minute: 'numeric', timeZoneName: 'short',
    weekday: 'short', month: 'short', day: 'numeric'
  });
  var utFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric'
  });
  function pad(x) { return (x < 10 ? '0' : '') + x; }
  function rot(id, deg) {
    document.getElementById(id).setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' 400 400)');
  }

  var exploring = false;
  var exploreMs = 0; // raw time being explored, in ms since epoch

  function render(t) {
    var d = new Date(t), eh = 0, em = 0, tz = '', wd = '', mo = '', dy = '';
    etFmt.formatToParts(d).forEach(function (p) {
      if (p.type === 'hour') eh = parseInt(p.value, 10) % 24;
      else if (p.type === 'minute') em = parseInt(p.value, 10);
      else if (p.type === 'timeZoneName') tz = p.value;
      else if (p.type === 'weekday') wd = p.value;
      else if (p.type === 'month') mo = p.value;
      else if (p.type === 'day') dy = p.value;
    });
    var uh = d.getUTCHours(), um = d.getUTCMinutes();
    rot('hh', ((eh % 12) + em / 60) * 30);
    rot('mh', em * 6);
    rot('uh', ((uh % 12) + um / 60) * 30);
    var h12 = eh % 12 === 0 ? 12 : eh % 12;
    document.getElementById('et').textContent = pad(h12) + ':' + pad(em) + ' ' + (eh < 12 ? 'AM' : 'PM');
    document.getElementById('tz').textContent = tz;
    document.getElementById('etd').textContent = wd + ' ' + mo + ' ' + dy;
    document.getElementById('ut').textContent = pad(uh) + ':' + pad(um);
    document.getElementById('utd').textContent = utFmt.format(d);
    var diff = ((uh - eh) + 24) % 24;
    document.getElementById('diff').textContent = 'UTC is ' + diff + ' hours ahead of Eastern (' + tz + ')';
    document.getElementById('uh').setAttribute('aria-valuenow', String(uh * 60 + um));
    document.getElementById('uh').setAttribute('aria-valuetext', pad(uh) + ':' + pad(um) + ' UTC');
  }

  function shown() {
    return exploring ? Math.round(exploreMs / MIN) * MIN : Math.floor(Date.now() / MIN) * MIN;
  }
  function setMode(x) {
    exploring = x;
    var el = document.getElementById('mode');
    el.textContent = x ? 'EXPLORING' : 'LIVE';
    el.className = 'mode' + (x ? ' exploring' : '');
    document.getElementById('reset').disabled = !x;
  }
  function nudge(ms) {
    if (!exploring) { exploreMs = shown(); setMode(true); }
    exploreMs += ms;
    render(shown());
  }

  // Dragging: rotate the hand by however far the pointer rotates around the centre.
  var uhEl = document.getElementById('uh');
  var dragging = false, lastAng = 0;
  function pointerAngle(e) {
    var r = svg.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    return Math.atan2(dx, -dy) * 180 / Math.PI;
  }
  uhEl.addEventListener('pointerdown', function (e) {
    dragging = true;
    lastAng = pointerAngle(e);
    uhEl.classList.add('dragging');
    try { uhEl.setPointerCapture(e.pointerId); } catch (err) {}
    if (!exploring) { exploreMs = shown(); setMode(true); }
    e.preventDefault();
  });
  uhEl.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var a = pointerAngle(e);
    var delta = a - lastAng;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    lastAng = a;
    exploreMs += delta / 360 * HALF_DAY;
    render(shown());
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    uhEl.classList.remove('dragging');
    try { uhEl.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  uhEl.addEventListener('pointerup', endDrag);
  uhEl.addEventListener('pointercancel', endDrag);
  uhEl.addEventListener('keydown', function (e) {
    var step = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') step = 5 * MIN;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') step = -5 * MIN;
    else if (e.key === 'PageUp') step = 60 * MIN;
    else if (e.key === 'PageDown') step = -60 * MIN;
    if (step) { e.preventDefault(); nudge(step); }
  });

  document.getElementById('reset').addEventListener('click', function () {
    setMode(false);
    render(shown());
  });

  render(shown());
  setInterval(function () { if (!exploring) render(shown()); }, 1000);
})();
</script>
